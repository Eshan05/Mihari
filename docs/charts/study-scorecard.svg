<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2551.5" viewBox="0 0 600 1701" role="img" aria-labelledby="scorecard-title scorecard-desc">
  <title id="scorecard-title">Mihari: one result from each of 15 studies</title>
  <desc id="scorecard-desc">Fixed-share rollback: Healthy false rollbacks: threshold to sequential; 0.3% &#8594; 4.2%; lower is better. Telemetry stress: Weak faults caught, sequential rule: prompt to late; 84 &#8594; 76; higher is better. Joint guardrail: Combined faults caught: errors to errors + latency; 78.8% &#8594; 95.6%; higher is better. Initial risk matching: Outage false stops: errors to joint; match inconclusive; 5.1% &#8594; 4.7%; lower is better. Risk confirmation: Latency faults: errors to joint at comparable risk; 28 &#8594; 2,791; higher is better. Rollout impact: Added slows per latency fault: errors to joint; 30.189 &#8594; 20.682; lower is better. Fixed-step rollout: Healthy runs promoted; baseline capability; 152 / 200; higher is better. Adaptive middle stage: Healthy runs promoted: fixed to adaptive; 154 &#8594; 155; higher is better. Staged risk: Share-triggered exposure: fixed to adaptive; 768.8 &#8594; 1,011.8; lower is better. Recorded-trace replay: Modeled slowdowns caught on recorded timings; 6 / 6; higher is better. Regional traffic mix: Skewed outage, no false stop: pooled to adjusted; 673 &#8594; 2,000; higher is better. Regional triggers: Local faults: overall to joint; risk not matched; 993 &#8594; 2,867; higher is better. Regional precision: Local faults: overall to joint at comparable risk; 1,041 &#8594; 2,933; higher is better. Lindon adjustment: Predictive attribute: mean looks, unadjusted to adjusted; 14.19 &#8594; 2.63; lower is better. Shao state-space: RMSE after sudden shift: plain to smoothed; 1.777 &#8594; 9.183 ms; lower is better.</desc>
  <style>
    svg { --surface:#fff; --ink:#172235; --muted:#4d596b; --grid:#d6dee9; --track:#e7edf4; --series:#245cdc; --joint:#a84315; }
    @media (prefers-color-scheme: dark) {
      svg { --surface:#141a24; --ink:#f3f6fb; --muted:#b9c6d8; --grid:#435065; --track:#2b3749; --series:#83aaff; --joint:#ffad78; }
    }
    text { font-family: system-ui, "Segoe UI", sans-serif; fill:var(--ink); font-variant-numeric:tabular-nums; }
    .heading { font-size:29px; font-weight:700; }
    .category { font-size:23px; font-weight:650; }
    .number { font-size:22px; font-weight:650; }
    .note { font-size:19px; fill:var(--muted); }
    .axis { font-size:18px; fill:var(--muted); }
    .direction { font-size:19px; font-weight:600; }
    .surface { fill:var(--surface); }
    .grid { stroke:var(--grid); stroke-width:1; }
    .marker { stroke:var(--ink); stroke-width:3; }
    .track { fill:var(--track); }
    .series { fill:var(--series); }
    .joint { fill:var(--joint); }
  </style>
